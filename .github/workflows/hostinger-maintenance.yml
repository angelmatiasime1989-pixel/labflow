name: Preparar MySQL en Hostinger
on:
  push:
    branches: [fix/persistent-storage-password-eye]
    paths:
      - .github/hostinger-maintenance-request.json
      - .github/workflows/hostinger-maintenance.yml
      - scripts/hostinger-maintenance.mjs
      - scripts/hostinger-github-runner.mjs
      - scripts/hostinger-ssh-prepare.mjs
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect revisa rutas y conteos; migrate copia a un MySQL vacío'
        type: choice
        options: [inspect, migrate]
        default: inspect
      sqlite_source:
        description: 'Solo migrate: ruta absoluta de la base activa confirmada'
        type: string
      writes_paused:
        description: 'Solo migrate: he detenido las escrituras de todos los usuarios'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hostinger-database-maintenance
  cancel-in-progress: false
jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hostinger-maintenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar acceso SSH verificado
        env:
          PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_SSH_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_FINGERPRINT: ${{ vars.HOSTINGER_SSH_FINGERPRINT }}
          SSH_KEY_FILE: ${{ runner.temp }}/hostinger-key
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/hostinger-known-hosts
        run: node scripts/hostinger-ssh-prepare.mjs
      - name: Ejecutar mantenimiento sin desplegar
        env:
          MAINTENANCE_MODE: ${{ inputs.mode || 'inspect' }}
          SQLITE_SOURCE: ${{ inputs.sqlite_source }}
          WRITES_PAUSED: ${{ inputs.writes_paused }}
          HOSTINGER_SSH_HOST: ${{ vars.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_PORT: ${{ vars.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_USER: ${{ vars.HOSTINGER_SSH_USER }}
          HOSTINGER_NODE_BIN: ${{ vars.HOSTINGER_NODE_BIN }}
          SSH_KEY_FILE: ${{ runner.temp }}/hostinger-key
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/hostinger-known-hosts
          MYSQL_HOST: srv823.hstgr.io
          MYSQL_PORT: '3306'
          MYSQL_DATABASE: u187670937_qubo
          MYSQL_USER: u187670937_amatias
          MYSQL_PASSWORD: ${{ secrets.HOSTINGER_MYSQL_PASSWORD }}
          MYSQL_BACKUP_KEY: ${{ secrets.HOSTINGER_BACKUP_ENCRYPTION_KEY }}
          MYSQL_SSL: ${{ vars.HOSTINGER_MYSQL_SSL || 'true' }}
          MYSQL_SSL_CA: ${{ secrets.HOSTINGER_MYSQL_SSL_CA }}
        run: node scripts/hostinger-github-runner.mjs
      - name: Eliminar credenciales del ejecutor
        if: always()
        run: rm -f "$RUNNER_TEMP/hostinger-key" "$RUNNER_TEMP/hostinger-known-hosts"
