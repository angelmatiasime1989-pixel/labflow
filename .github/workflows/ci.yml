name: Validación de Qubo Labs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check:hostinger-source
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - run: npm test
      - name: Probar PWA en Chromium Linux
        env:
          PWA_REPORT_DIR: ${{ runner.temp }}/qubo-pwa-report
        run: |
          export CHROMIUM_BIN="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROMIUM_BIN"
          npm run test:pwa-browser
      - name: Conservar informe de navegador
        uses: actions/upload-artifact@v4
        with:
          name: pwa-linux-results
          path: ${{ runner.temp }}/qubo-pwa-report
          if-no-files-found: warn
