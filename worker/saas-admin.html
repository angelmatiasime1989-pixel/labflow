function paintPackages(){if(!draftModules.size&&draftMembership!=='custom')draftModules=new Set(P.packages.find(p=>p.id===draftMembership)?.modules||['settings']);$('#package-grid').innerHTML='<div class="cube-package-presets">'+P.packages.map(p=>'<button type="button" class="'+(draftMembership===p.id?'primary':'')+'" onclick="selectMembership(\''+p.id+'\')">Usar '+esc(p.name)+'</button>').join('')+'</div>'+P.catalog.filter(m=>m.status==='ready').map(m=>'<label class="module-option '+(draftModules.has(m.id)?'selected':'')+'"><input type="checkbox" '+(draftModules.has(m.id)?'checked':'')+' '+(m.required?'disabled':'')+' onchange="toggleLicensedModule(\''+m.id+'\',this.checked)"><strong>'+esc(m.name)+'</strong><p>'+esc(m.description)+'</p><small>'+(m.required?'Base obligatoria':m.toolCount+' herramientas')+'</small></label>').join('');$('#package-summary').innerHTML='<b>Membresía '+(draftMembership==='custom'?'personalizada':esc(P.packages.find(p=>p.id===draftMembership)?.name||''))+'</b> · '+draftModules.size+' módulos. Marca las casillas de las herramientas que tendrá el cliente. Sus dependencias se incluyen automáticamente. Al quitar un módulo de apoyo también se quitan los que lo necesitan. Los datos se conservan.';}

function toggleLicensedModule(id,checked){if(checked){draftModules.add(id);let changed=true;while(changed){changed=false;for(const code of [...draftModules])for(const dep of P.catalog.find(m=>m.id===code)?.requires||[])if(!draftModules.has(dep)){draftModules.add(dep);changed=true;}}}else{draftModules.delete(id);let changed=true;while(changed){changed=false;for(const code of [...draftModules])if(P.catalog.find(m=>m.id===code)?.requires?.some(dep=>!draftModules.has(dep))){draftModules.delete(code);changed=true;}}}draftModules.add('settings');const preset=P.packages.find(p=>p.modules.length===draftModules.size&&p.modules.every(id=>draftModules.has(id)));draftMembership=preset?.id||'custom';paintPackages();}

document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#overlay').innerHTML='';});function mobileNavigationCube(){return '<nav class="cube-admin-bottom" aria-label="Navegación móvil">'+[['dashboard','dashboard','Inicio'],['customers','users','Clientes'],['leads','briefcase','Prospectos'],['blog','history','Blog'],['legal','shield','Datos legales'],['catalog','layers','Membresías y módulos'],['finance','briefcase','Finanzas'],['audit','history','Bitácora']].map(([k,i,t])=>'<button class="'+(page===k?'active':'')+'" onclick="nav(\''+k+'\')" aria-label="'+t+'">'+icon(i)+'<span>'+t+'</span></button>').join('')+'</nav>';}
function setupCustomerStepsCube(){const form=$('#customer-form');if(!form?.querySelectorAll)return;const sections=[...form.querySelectorAll(':scope > section.card')];if(sections.length!==3)return;form._cubeSections=sections;form._cubeStep=0;const progress=document.createElement('nav');progress.className='cube-steps';progress.setAttribute('aria-label','Alta de cliente');progress.innerHTML=['Cliente','Membresía','Acceso'].map((s,i)=>'<button type="button" data-cube-step="'+i+'" onclick="customerStepCube('+i+')"><b>'+String(i+1).padStart(2,'0')+'</b>'+s+'</button>').join('');form.prepend(progress);const actions=form.querySelector(':scope > .actions');actions.insertAdjacentHTML('afterbegin','<button type="button" id="cube-previous" onclick="customerStepCube($(\'#customer-form\')._cubeStep-1)">← Anterior</button>');actions.insertAdjacentHTML('beforeend','<button type="button" class="primary" id="cube-next" onclick="customerStepCube($(\'#customer-form\')._cubeStep+1)">Continuar →</button>');const optional=['legalName','rfc','phone'].map(k=>form.elements[k]?.closest('.field')).filter(Boolean);if(optional.length){const details=document.createElement('details');details.className='cube-optional';details.innerHTML='<summary>Datos fiscales y de contacto adicionales</summary><div class="formgrid"></div>';optional.forEach(f=>details.querySelector('.formgrid').append(f));sections[0].append(details);}paintCustomerStepCube();}
function paintCustomerStepCube(){const f=$('#customer-form');if(!f?._cubeSections)return;f._cubeSections.forEach((s,i)=>s.hidden=i!==f._cubeStep);f.querySelectorAll(':scope > .divider').forEach(n=>n.hidden=true);f.querySelectorAll('[data-cube-step]').forEach((b,i)=>{b.classList.toggle('active',i===f._cubeStep);b.setAttribute('aria-current',i===f._cubeStep?'step':'false');});$('#cube-previous').hidden=f._cubeStep===0;$('#cube-next').hidden=f._cubeStep===2;f.querySelector('[type=submit]').hidden=f._cubeStep!==2;}
function validCustomerSectionCube(index){const f=$('#customer-form'),section=f._cubeSections?.[index];if(!section)return true;const invalid=[...section.querySelectorAll('input,select,textarea')].find(e=>!e.checkValidity());if(!invalid)return true;f._cubeStep=index;paintCustomerStepCube();const details=invalid.closest('details');if(details)details.open=true;invalid.reportValidity();return false;}
function customerStepCube(index){const f=$('#customer-form');if(!f?._cubeSections||index<0||index>2)return;if(index>f._cubeStep)for(let n=0;n<index;n++)if(!validCustomerSectionCube(n))return;f._cubeStep=index;paintCustomerStepCube();f.querySelector('[aria-current=step]')?.focus();}
function validateCustomerCube(form){if(form._cubeSections){for(let n=0;n<3;n++)if(!validCustomerSectionCube(n))return false;return true;}return form.reportValidity();}

function openSales(id){editingLead=id;page='lead';render();}
function salesDetail(id){const l=P.leads.find(l=>l.id===id);if(!l)return nav('leads');$('#content').innerHTML='<button class="back" onclick="nav(\'leads\')">← Volver a prospectos</button>'+head(l.company,(l.type==='demo'?'Solicitud de demostración':'Consulta de contacto')+' · '+l.folio,'<button class="primary" onclick="customerFromSales(\''+l.id+'\')">Preparar alta de cliente →</button>')+'<div class="grid"><section class="card"><h2>'+esc(l.name)+'</h2><p>'+esc(l.role||'')+'</p><p><a href="mailto:'+esc(l.email)+'">'+esc(l.email)+'</a>'+ (l.phone?'<br>'+esc(l.phone):'')+'</p><div class="divider"></div><p>'+esc(l.message||'Solicita conocer la plataforma.')+'</p><dl class="sales-facts">'+[['Actividad',l.activity],['Tamaño del equipo',l.teamSize],['Membresía',P.packages.find(p=>p.id===l.membership)?.name||(l.membership==='custom'?'Personalizada':'Por definir')],['Modalidad',l.billingCycle==='annual'?'Anual':l.billingCycle==='monthly'?'Mensual':'Por definir'],['Ciudad',l.city],['Fecha sugerida',l.preferredDate],['Horario sugerido',l.preferredTime],['Zona horaria','Centro de México'],['Recepción',new Date(l.createdAt).toLocaleString('es-MX')]].filter(x=>x[1]).map(([k,v])=>'<div><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>').join('')+'</dl><details class="cube-optional"><summary>Privacidad y origen</summary><p>Origen: '+esc(l.source)+'<br>Aviso informado: '+esc(l.consent.privacyVersion)+'<br>Comunicaciones opcionales: '+(l.consent.marketing?'Autorizadas':'No autorizadas')+'<br>Conservación hasta: '+new Date(l.retentionUntil).toLocaleDateString('es-MX')+'</p></details></section><section class="card"><h2>Seguimiento comercial</h2><form onsubmit="saveSalesLead(event,\''+l.id+'\')"><label class="field">Estado<select name="status">'+['Nuevo','Contactado','Demo agendada','Propuesta enviada','Ganado','No interesado','Archivado'].map(s=>'<option '+(l.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label class="field">Próximo seguimiento o demo<input name="followupDate" type="date" value="'+esc(l.followupDate||'')+'"></label><label class="field">Nota de seguimiento<textarea name="note" maxlength="2000" placeholder="Qué se acordó y cuál es el siguiente paso"></textarea></label><div id="lead-error" role="alert"></div><div class="actions"><button class="primary" type="submit">Guardar seguimiento</button></div></form></section></div><section class="card" style="margin-top:20px"><h2>Historial</h2>'+(l.notes.length?l.notes.slice().reverse().map(n=>'<div class="guide-item"><div><h3>'+esc(n.status)+'</h3><p>'+esc(n.text)+'</p><small>'+new Date(n.at).toLocaleString('es-MX')+' · '+esc(n.actor)+'</small></div></div>').join(''):'<p>Aún no se ha registrado seguimiento.</p>')+'</section>';}
async function saveSalesLead(event,id){event.preventDefault();const f=event.target,b=f.querySelector('button[type=submit]');b.disabled=true;try{await api('lead',{id,salesRevision:P.salesRevision,...Object.fromEntries(new FormData(f))});await refresh();toast('Seguimiento guardado');}catch(e){$('#lead-error').innerHTML='<div class="error">'+esc(e.message)+'</div>';if(e.status===409)P=await api('state');}finally{b.disabled=false;}}

function exportSalesCSV(){const fields=['folio','type','company','name','email','phone','membership','billingCycle','status','createdAt','followupDate'];const cell=v=>'"'+(/^[=+\-@\t\r]/.test(String(v||''))?"'":'')+String(v||'').replaceAll('"','""')+'"';const csv='\uFEFF'+fields.map(cell).join(',')+'\r\n'+(P.leads||[]).map(l=>fields.map(k=>cell(l[k])).join(',')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='qubolabs-prospectos.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function legalSettingsPage(){const l=P.legal||{};$('#content').innerHTML=head('Datos legales','Estos datos se publicarán en el aviso de privacidad y los términos de la landing.')+'<section class="card"><div class="hint">'+(l.ready&&l.channelReady?'Captación habilitada. Los formularios registran la versión del aviso y la decisión sobre publicidad.':'Confirma los datos y textos del responsable y configura el canal comercial para habilitar contacto y demo.')+'</div><form onsubmit="saveLegalSettings(event)"><div class="formgrid"><label class="field full">Nombre completo o razón social del responsable *<input name="name" value="'+esc(l.name||'')+'" required minlength="3" maxlength="200"></label><label class="field full">Domicilio completo para atención de solicitudes *<textarea name="address" required minlength="15" maxlength="600" placeholder="Calle, número, colonia, municipio, estado, código postal y país">'+esc(l.address||'')+'</textarea></label><label class="field">Correo de privacidad y atención ARCO *<input name="email" type="email" value="'+esc(l.email||'')+'" required maxlength="200"></label><label class="field">Teléfono de atención<input name="phone" value="'+esc(l.phone||'')+'" maxlength="40"></label><label class="field">Conservación de prospectos sin contrato (meses)<input name="retentionMonths" type="number" min="1" max="24" value="'+(l.retentionMonths||12)+'" required><small>Desde el alta o último seguimiento. No sustituye plazos de conservación contractual o fiscal.</small></label></div><label class="legal-check"><input name="confirmed" type="checkbox" required>Confirmo que estos datos son correctos, que atiendo ese correo y autorizo su publicación como responsable.</label><label class="legal-check"><input name="textsApproved" type="checkbox" required>Revisé y apruebo los textos actuales del aviso de privacidad y términos para este servicio.</label><div id="legal-error" role="alert"></div><div class="actions"><a href="/privacidad" target="_blank" rel="noopener">Revisar aviso ↗</a><a href="/terminos" target="_blank" rel="noopener">Revisar términos ↗</a><button class="primary" type="submit">Guardar datos y aprobación legal</button></div></form></section>';}
async function saveLegalSettings(event){event.preventDefault();const f=event.target,b=f.querySelector('button[type=submit]');b.disabled=true;try{const data=Object.fromEntries(new FormData(f));await api('legal',{...data,confirmed:f.elements.confirmed.checked,textsApproved:f.elements.textsApproved.checked});await refresh();toast(P.legal?.ready&&P.legal?.channelReady?'Datos publicados y formularios habilitados':'Datos publicados. Revisa la configuración del canal comercial para activar envíos');}catch(e){$('#legal-error').innerHTML='<div class="error">'+esc(e.message)+'</div>';}finally{b.disabled=false;}}

async function saveProviderProfile(event){event.preventDefault();const f=event.target,b=f.querySelector('[type=submit]');b.disabled=true;try{let avatar=f.elements.removeAvatar.checked?'':P.operator.avatar||'';const file=f.elements.image.files[0];if(file&&!f.elements.removeAvatar.checked){if(!['image/png','image/jpeg'].includes(file.type)||file.size>8*1024*1024)throw Error('Selecciona PNG o JPG de hasta 8 MB');const img=await createImageBitmap(file),scale=Math.min(1,320/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);img.close();avatar=canvas.toDataURL('image/jpeg',.82);}await api('profile',{nickname:f.elements.nickname.value,avatar});$('#overlay').innerHTML='';await refresh();toast('Perfil actualizado');}catch(e){const target=$('#provider-profile-error');if(target)target.textContent=e.message;else toast('Perfil guardado. Actualiza para cargar la vista más reciente.');}finally{b.disabled=false;}}

function membershipConfiguration(){return '<section class="card"><h2>Funciones por nivel de membresía</h2><p>Selecciona las funciones implementadas de cada nivel. Sus dependencias se incluyen automáticamente. Los niveles superiores heredan los inferiores. Los contratos actuales se conservan hasta aplicar expresamente el plan al cliente.</p>'+P.packages.filter(p=>!p.legacy).map(p=>'<details><summary>'+esc(p.name)+'</summary><form onsubmit="saveMembershipConfiguration(event,\''+p.id+'\')"><div class="cataloggrid">'+P.catalog.filter(m=>m.status==='ready').map(m=>'<label class="module-option"><input name="modules" type="checkbox" value="'+m.id+'" '+(p.modules.includes(m.id)?'checked ':'')+(m.required?'disabled ':'')+'><strong>'+esc(m.name)+'</strong><p>'+esc(m.description)+'</p><small>'+m.toolCount+' herramientas · '+(m.requires.length?'Dependencias: '+m.requires.map(id=>esc(P.catalog.find(x=>x.id===id)?.name||id)).join(', '):'Base obligatoria')+'</small></label>').join('')+'</div><details><summary>Elegir funciones individuales</summary><p>Las referencias necesarias y la configuración se conservan automáticamente para mantener los flujos. Revisa el resultado guardado antes de aplicarlo a un cliente.</p>'+P.catalog.filter(m=>m.status==='ready').map(m=>'<fieldset><legend>'+esc(m.name)+'</legend>'+(P.tools||[]).filter(t=>t.moduleId===m.id).map(t=>'<label class="module-option"><input type="checkbox" name="tools" value="'+t.id+'" '+(p.tools?.includes(t.id)?'checked ':'')+(m.required?'disabled ':'')+'>'+esc(t.name)+'</label>').join('')+'</fieldset>').join('')+'</details><p role="status" class="plan-status"></p><button class="primary" type="submit">Guardar funciones de '+esc(p.name)+'</button></form></details>').join('')+'</section>';}
async function saveMembershipConfiguration(event,planId){event.preventDefault();const f=event.target,button=f.querySelector('[type=submit]'),status=f.querySelector('.plan-status');button.disabled=true;try{const modules=[...f.querySelectorAll('[name=modules]:checked')].map(i=>i.value);const tools=[...f.querySelectorAll('[name=tools]:checked')].map(i=>i.value);await api('membership-plan',{planId,modules,tools});await refresh();toast('Funciones guardadas. No se modificaron contratos existentes.');}catch(e){status.textContent=e.message;if(e.status===409)toast('Actualiza el panel antes de volver a guardar.');}finally{button.disabled=false;}}
const originalCustomerPayments=customerDetail;
customerDetail=function(id){originalCustomerPayments(id);const c=P.customers.find(c=>c.id===id);if(!c)return;const payments=c.payments||[],total=payments.filter(p=>!p.voidedAt).reduce((sum,p)=>sum+p.amountCents,0),money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n/100);$('#content').insertAdjacentHTML('beforeend','<section class="card" style="margin-top:24px"><h2>Control e historial de pagos</h2><p>Registro manual de importes recibidos en MXN. No realiza cargos ni emite CFDI. Total vigente registrado: <b>'+money(total)+'</b>.</p><form onsubmit="registerCustomerPayment(event,\''+id+'\')"><div class="formgrid"><label class="field">Importe recibido (MXN)<input name="amount" inputmode="decimal" type="number" min="0.01" max="999999999.99" step="0.01" required></label><label class="field">Fecha de pago<input name="paidOn" type="date" required></label><label class="field">Periodo desde<input name="periodStart" type="date" required></label><label class="field">Periodo hasta<input name="periodEnd" type="date" required></label><label class="field">Método<select name="method"><option>Transferencia</option><option>Efectivo</option><option>Tarjeta</option><option>Otro</option></select></label><label class="field">Referencia<input name="reference" maxlength="160"></label><label class="field">Notas<input name="notes" maxlength="1000"></label></div><p class="payment-status" role="status"></p><button class="primary" type="submit">Registrar pago recibido</button></form><div class="tablewrap"><table><thead><tr><th>Fecha / periodo cubierto</th><th>Importe MXN</th><th>Método / referencia</th><th>Registro</th><th>Estado</th></tr></thead><tbody>'+payments.slice().reverse().map(p=>'<tr><td>'+esc(p.paidOn)+'<small>'+esc(p.periodStart)+' al '+esc(p.periodEnd)+'</small></td><td>'+money(p.amountCents)+'</td><td>'+esc(p.method)+'<small>'+esc(p.reference)+'</small></td><td>'+esc(p.createdBy)+'<small>'+esc(p.notes)+'</small></td><td>'+(p.voidedAt?'Anulado<small>'+esc(p.voidReason)+' · '+esc(p.voidedBy)+'</small>':'Registrado <button onclick="voidCustomerPayment(\''+id+'\',\''+p.id+'\')">Anular</button>')+'</td></tr>').join('')+'</tbody></table></div>'+(payments.length?'':'<p>No hay pagos registrados para este cliente.</p>')+'</section>');};
async function registerCustomerPayment(event,customerId){event.preventDefault();const f=event.target,button=f.querySelector('[type=submit]'),status=f.querySelector('.payment-status');button.disabled=true;if(!f.dataset.requestId)f.dataset.requestId=crypto.randomUUID();try{await api('payment',{...Object.fromEntries(new FormData(f)),customerId,action:'register',requestId:f.dataset.requestId});await refresh();toast('Pago registrado en el historial del cliente.');}catch(e){status.textContent=e.message;}finally{button.disabled=false;}}
async function voidCustomerPayment(customerId,paymentId){const reason=prompt('Motivo de anulación (mínimo 5 caracteres). El registro permanecerá en el historial.');if(reason===null)return;try{await api('payment',{action:'void',customerId,paymentId,reason});await refresh();toast('Pago anulado; historial conservado.');}catch(e){toast(e.message);}}

let editingBlog=null,blogImage='';
function blogAdminPage(){const posts=P.blogPosts||[];$('#content').innerHTML=head('Blog de Qubo Labs','Publica ideas útiles para la comunidad. Verifica las fuentes y la vigencia antes de publicar noticias normativas.','<button class="primary" onclick="editBlogPost()">＋ Nueva publicación</button>')+'<p><a href="/blog" target="_blank" rel="noopener">Abrir blog público ↗</a></p><div class="cataloggrid">'+posts.map(p=>'<section class="card"><small>'+esc(p.category)+' · '+esc(p.status)+'</small><h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt)+'</p><button onclick="editBlogPost(\''+p.id+'\')">Editar publicación</button>'+(p.status==='Publicado'?' <a href="/blog/'+esc(p.slug)+'" target="_blank" rel="noopener">Ver artículo ↗</a>':'')+'</section>').join('')+'</div>';}
function editBlogPost(id){const p=P.blogPosts.find(p=>p.id===id)||{};editingBlog=p.id||null;blogImage=p.image||'';page='blog-editor';$('#content').innerHTML='<button onclick="nav(\'blog\')">← Volver al blog</button>'+head(id?'Editar publicación':'Nueva publicación','El contenido se publica como texto seguro. La imagen se optimiza antes de cargarla.')+'<form onsubmit="saveBlogPost(event)"><section class="card"><div class="formgrid"><label class="field">Título<input name="title" required minlength="5" maxlength="180" value="'+esc(p.title)+'"></label><label class="field">Enlace (sin espacios ni acentos)<input name="slug" required maxlength="100" pattern="[a-z0-9]+(-[a-z0-9]+)*" value="'+esc(p.slug)+'" '+(p.status==='Publicado'?'readonly':'')+'></label><label class="field">Tema<input name="category" required maxlength="100" value="'+esc(p.category)+'"></label><label class="field">Tipo<select name="kind">'+['Guía informativa','Artículo','Noticia'].map(k=>'<option '+(p.kind===k?'selected':'')+'>'+k+'</option>').join('')+'</select></label><label class="field">Estado<select name="status">'+['Borrador','Publicado','Archivado'].map(k=>'<option '+(p.status===k?'selected':'')+'>'+k+'</option>').join('')+'</select></label></div><label class="field">Resumen (20 a 400 caracteres)<textarea name="excerpt" required minlength="20" maxlength="400">'+esc(p.excerpt)+'</textarea></label><label class="field">Contenido (100 a 30,000 caracteres)<textarea name="body" rows="16" required minlength="100" maxlength="30000">'+esc(p.body)+'</textarea></label><label class="field">Fuentes HTTPS, una por línea<textarea name="sources" rows="4">'+esc((p.sources||[]).join('\n'))+'</textarea></label><label class="field">Nota informativa<input name="verificationNote" maxlength="500" value="'+esc(p.verificationNote||'Información orientativa; consulta las fuentes oficiales.')+'"></label><label class="field">Imagen de portada (PNG o JPG, máximo 8 MB)<input type="file" accept="image/png,image/jpeg" onchange="loadBlogImage(this)"></label><img id="blog-image-preview" alt="Vista previa de la portada" '+(!blogImage?'hidden':'')+' src="'+esc(blogImage)+'" style="max-width:100%;max-height:220px;border-radius:12px"><p><button type="button" onclick="blogImage=\'\';document.getElementById(\'blog-image-preview\').hidden=true">Quitar imagen</button></p><p id="blog-editor-status" role="status"></p><div class="actions"><button type="button" onclick="nav(\'blog\')">Cancelar</button><button class="primary" type="submit">Guardar publicación</button></div></section></form>';}
async function loadBlogImage(input){const status=document.getElementById('blog-editor-status');try{const file=input.files[0];if(!file)return;if(!['image/png','image/jpeg'].includes(file.type)||file.size>8*1024*1024)throw Error('Selecciona PNG o JPG de hasta 8 MB');const image=await createImageBitmap(file),scale=Math.min(1,1000/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);image.close();let result=canvas.toDataURL('image/jpeg',.78);if(result.length>350000)result=canvas.toDataURL('image/jpeg',.5);if(result.length>350000)throw Error('La imagen sigue siendo demasiado grande; selecciona una imagen más sencilla.');blogImage=result;const preview=document.getElementById('blog-image-preview');preview.src=result;preview.hidden=false;status.textContent='Imagen lista. Guarda la publicación para conservarla.';}catch(e){status.textContent=e.message;input.value='';}}
async function saveBlogPost(event){event.preventDefault();const f=event.target,b=f.querySelector('[type=submit]');b.disabled=true;try{await api('blog',{...Object.fromEntries(new FormData(f)),id:editingBlog,image:blogImage});page='blog';await refresh();toast('Publicación guardada.');}catch(e){document.getElementById('blog-editor-status').textContent=e.message;}finally{b.disabled=false;}}
