name = "labflow-saas"
main = "worker/index.js"
compatibility_date = "2026-10-13"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "REEMPLAZAR_POR_BUCKET_REAL"

[vars]
SITE_URL = "https://REEMPLAZAR_DOMINIO"
# EMAIL_FROM: remitente verificado opcional.
# RESEND_API_KEY: configurar como secreto, nunca en este archivo.

# SAAS_ADMIN_AUTH: JSON de credenciales independientes, cargar como secreto.
# Generar con scripts/admin-credentials.mjs; ver docs/phase-one-auth.md.
# Las cabeceras externas y SAAS_TEST_OPERATOR nunca conceden acceso.
