<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#071b38"><title>Cambia tu contraseña · Qubo Labs</title><style>body{margin:0;background:#eef3f9;color:#112b49;font:16px/1.6 system-ui;min-height:100dvh;display:grid;place-items:center}main{box-sizing:border-box;width:min(460px,calc(100% - 32px));padding:32px;background:white;border:1px solid #dce6f0;border-radius:22px;box-shadow:0 20px 60px #071b3810}img{width:180px;max-width:100%}h1{font-size:26px;line-height:1.2}p{color:#657990;font-size:14px}label{display:grid;gap:7px;margin:18px 0;font-size:13px;font-weight:600}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:9px;font:inherit}input{border:1px solid #c8d6e5;font-size:16px}button{border:0;background:#163c68;color:white;cursor:pointer;min-height:47px}button:disabled{opacity:.6;cursor:wait}input:focus-visible,button:focus-visible{outline:3px solid #c9a45d;outline-offset:3px}#error{color:#a52c3e}small{font-size:12px;color:#657990}.secondary{margin-top:14px;background:#f1f5fa;color:#294866}</style><link rel="icon" href="/pwa/icon.svg" type="image/svg+xml"></head><body><main><a href="/"><img src="/assets/cubolabs-color.png" alt="Qubo Labs"></a><h1>Crea tu contraseña personal.</h1><p>Por seguridad, debes cambiar la contraseña temporal antes de acceder a la administración.</p><form id="change-password"><label for="current">Contraseña actual o temporal<input id="current" name="currentPassword" type="password" autocomplete="current-password" maxlength="128" required></label><label for="new">Nueva contraseña<input id="new" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label for="confirm">Repite la nueva contraseña<input id="confirm" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><small>Entre 12 y 128 caracteres. Debe ser diferente de la contraseña temporal.</small><p id="error" role="alert" aria-live="polite"></p><button type="submit">Guardar contraseña y entrar</button></form><button id="logout" class="secondary" type="button">Cerrar sesión</button></main><script>
const form=document.getElementById('change-password'),errorBox=document.getElementById('error');form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('[type=submit]');if(button.disabled)return;errorBox.textContent='';if(form.elements.newPassword.value!==form.elements.confirmPassword.value){errorBox.textContent='Las contraseñas nuevas no coinciden.';return;}button.disabled=true;try{const r=await fetch('/api/provider/change-password',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form))),signal:AbortSignal.timeout(20000)}),data=await r.json();if(!r.ok){if(r.status===401&&data.error?.includes('Inicia sesión')){location.replace('/administrador/ingresar');return;}throw Error(data.error||'No se pudo cambiar la contraseña.');}form.reset();location.replace('/admin/');}catch(error){errorBox.textContent=error.name==='TimeoutError'?'La conexión tardó demasiado. Vuelve a intentar.':error.message;}finally{button.disabled=false;}});document.getElementById('logout').addEventListener('click',async()=>{try{const r=await fetch('/api/provider/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error('No se pudo cerrar la sesión.');form.reset();location.replace('/administrador/ingresar');}catch(error){errorBox.textContent=error.message;}});
</script></body></html>
