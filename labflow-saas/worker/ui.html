let openNavGroups=new Set();let S=null,current='dashboard',query='',statusFilter='',selected=null;
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=x=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:2}).format(x||0);

async function api(path,opt={}){const read=(opt.method||'GET').toUpperCase()==='GET',attempts=read?3:1;for(let attempt=0;attempt<attempts;attempt++){const controller=read&&!opt.signal?new AbortController():null,timer=controller?setTimeout(()=>controller.abort(),15000):null;try{const r=await fetch('/api/'+path,{...opt,cache:'no-store',...(controller?{signal:controller.signal}:{}),headers:{'Content-Type':'application/json',...opt.headers}});let d;try{d=await r.json()}catch{throw Object.assign(new Error('No se pudo recibir la respuesta del servidor. Reintenta el acceso.'),{status:502})}if(!r.ok)throw Object.assign(new Error(d.error||'No se pudo completar'),{status:r.status});return d;}catch(e){const transient=!e.status||[408,409,429,502,503,504].includes(e.status);if(read&&transient&&attempt<attempts-1){if(timer)clearTimeout(timer);await new Promise(resolve=>setTimeout(resolve,400*(attempt+1)));continue;}if(!e.status)throw new Error(e.name==='AbortError'?'El servidor tardó en responder. Reintenta para recuperar la conexión.':'Se perdió la conexión al servidor. Comprueba tu conexión y reintenta.');throw e;}finally{if(timer)clearTimeout(timer);}}}

async function loginScreen(){let users;try{users=(await api('profiles')).users}catch(e){$('#root').innerHTML='<div class="loading"><h2>No se pudo cargar la demo</h2><p>'+esc(e.message)+'</p><button onclick="loginScreen()">Reintentar</button></div>';return}$('#root').innerHTML='<div class="login"><section class="loginhero"><div class="eyebrow" style="color:#c6dbf7">LABFLOW · DEMO PÚBLICA</div><h1>Tu laboratorio, conectado.</h1><p>Prueba cotizaciones, calendario, gestión y resultados.</p><div class="orbit"><span>∿</span></div></section><section class="loginpanel"><div class="loginbox"><div class="brand"><span>∿</span>LabFlow</div><h2>Acceso de pruebas</h2><p>Entra con un usuario y contraseña. No necesitas cuenta de ChatGPT.</p><form onsubmit="enter(event)"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required placeholder="admin"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">Entrar al ERP →</button><div id="loginerror" role="alert"></div></form><div class="footerlabel">LabFlow · Espacio independiente de tu laboratorio.</div></div></section></div>';}
async function enter(e){e?.preventDefault();const button=e?.target?.querySelector('button');if(button)button.disabled=true;try{await api('login',{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});current='dashboard';await refresh()}catch(e){$('#loginerror').innerHTML='<div class="error">'+esc(e.message)+'</div>';}finally{if(button)button.disabled=false;}}
async function logout(){await api('logout',{method:'POST',body:'{}'});S=null;await loginScreen()}
function nav(m){current=m;query='';statusFilter='';render()}
function render(){let groups='';for(const g of [...new Set(Object.values(META).map(x=>x.group))].sort((a,b)=>['Comercial','Operación','Técnica','Calidad','Compras','Almacén','Recursos humanos','Contabilidad','Configuración'].indexOf(a)-['Comercial','Operación','Técnica','Calidad','Compras','Almacén','Recursos humanos','Contabilidad','Configuración'].indexOf(b))){const ms=Object.keys(META).filter(m=>META[m].group===g&&show(m));if(ms.length)groups+='<button class="nav module-group '+(META[current]?.group===g?'active':'')+'" onclick="openModule22('+esc(JSON.stringify(g))+')"><i>'+moduleIcon(g==='Configuración'?'settings':ms[0])+'</i>'+esc(g)+'</button>'}$('#root').innerHTML='<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><span>∿</span>LabFlow</div><button class="nav '+(current==='dashboard'?'active':'')+'" onclick="nav(\'dashboard\')"><i>▦</i>Vista general</button>'+groups+'<div class="navgroup">Seguimiento</div><button class="nav '+(current==='alerts'?'active':'')+'" onclick="nav(\'alerts\')"><i>◉</i>Notificaciones</button><button class="nav '+(current==='audit'?'active':'')+'" onclick="nav(\'audit\')"><i>↺</i>Bitácora</button><button class="nav '+(current==='help'?'active':'')+'" onclick="nav(\'help\')"><i>?</i>Guía de prueba</button><div class="sidebarfoot">'+esc(S.labProfile?.name||'Laboratorio')+'<br>ISO/IEC 17025:2017<br><br><span style="color:#44764a">● Datos guardados en servidor</span></div></aside><main class="main"><header class="topbar"><button class="mobilemenu" onclick="$(\'#sidebar\').classList.toggle(\'open\')">☰</button><div class="crumb">'+esc(S.labProfile?.name||'Laboratorio')+' / '+esc(META[current]?.title||({dashboard:'Vista general',alerts:'Notificaciones',audit:'Bitácora',help:'Guía de prueba'}[current]))+'</div><div class="profile"><span class="avatar">'+esc(S.me.name.slice(0,1))+'</span><div class="profiletext"><b>'+esc(S.me.name)+'</b><br><span style="color:var(--muted)">'+esc(S.me.role)+'</span></div><button class="inlinebutton" onclick="nav(\'alerts\')">◉ '+Object.values(groups18()).reduce((n,rows)=>n+rows.length,0)+' avisos nuevos</button><button class="inlinebutton" onclick="reload()" title="Actualizar datos del servidor">↻ Actualizar</button><button class="inlinebutton" onclick="logout()">Cambiar usuario</button></div></header><div class="work"><div class="demo"><span>ENTORNO DE PRUEBAS · Información ficticia, sin validez técnica.</span><span>Fecha: '+date(S.today)+' · v42 · pública</span></div><div id="content"></div></div></main></div>';if(current==='calendar')calendarPage();else if(current==='dashboard')dashboard();else if(current==='alerts')alertsPage();else if(current==='audit')auditPage();else if(current==='help')helpPage();else listPage()}

async function action(m,id,a){if(a==='cancel'&&!confirm('¿Cancelar este registro? Se conservará su historial.'))return;try{const before=ref(m,id)?.status;const result=await mutate(m,id,a);await refresh();if(m==='purchases'&&a==='advance'&&before==='Recibida solicitud'){openForm('purchaseBids',null,{requestId:id});toast('Solicitud atendida. Registra la cotización del proveedor.');}else if(result.receipt?.sent){closeModal();toast('Transición guardada');}else if(ref(m,id)){detail(m,id);toast('Transición guardada');}else{closeModal();toast('Transición guardada');}}catch(e){if($('#modalerror'))$('#modalerror').innerHTML='<div class="error">'+esc(e.message)+'</div>';else toast(e.message);if(e.status===409)S=await api('state')}}
async function upload(m,id){const f=$('#attachment').files[0];if(!f)return;if(f.size>5242880){$('#modalerror').innerHTML='<div class="error">Máximo 5 MB por archivo.</div>';return}const reader=new FileReader();reader.onload=async()=>{try{await mutate(m,id,'attach',{}, {base64:reader.result.split(',')[1],name:f.name});await refresh();detail(m,id);toast('Evidencia adjunta')}catch(e){$('#modalerror').innerHTML='<div class="error">'+esc(e.message)+'</div>'}};reader.readAsDataURL(f)}
async function reload(){try{await refresh();toast('Información actualizada')}catch(e){toast(e.message)}}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csvExport(){const m=current,keys=['id','folio',...META[m].fields.map(x=>x[0]),...(m==='payroll'?['rateSnapshot','basePay','gross','net']:[]),'status'];const cell=v=>'"'+String(v??'').replace(/"/g,'""').replace(/^[=+@-]/,"'$&")+'"';download('LabFlow-'+m+'.csv','\ufeff'+[keys,...S[m].map(x=>keys.map(k=>x[k]))].map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function alertsPage(){$('#content').innerHTML=head('Notificaciones y aprobaciones',(S.approvals?.filter(x=>x.approval).length||0)+' registros requieren tu autorización. Las alertas se actualizan con cada cambio.','<button onclick="reload()">↻ Actualizar</button>')+'<div class="card">'+alerts().map(x=>'<div class="alert" style="cursor:pointer" onclick="detail(\''+x.module+'\','+x.id+')"><span class="alerticon">'+(x.approval?'✓':'!')+'</span><div><b>'+esc(x.title)+'</b><p>'+esc(x.text)+'</p></div><span style="margin-left:auto">↗</span></div>').join('')+'</div><p class="notes">Esta versión muestra avisos dentro del ERP. No envía correo ni WhatsApp.</p>'}
function auditPage(){$('#content').innerHTML=head('Bitácora de cambios','Quién hizo qué, cuándo y con qué motivo.','<button onclick="reload()">↻ Actualizar</button>')+'<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Módulo</th><th>Acción</th><th>Registro</th></tr></thead><tbody>'+S.audit.map((x,i)=>'<tr onclick="auditDetail('+i+')"><td>'+new Date(x.at).toLocaleString('es-MX')+'</td><td>'+esc(x.user)+'</td><td>'+esc(META[x.module]?.title||x.module)+'</td><td>'+esc(x.action)+'</td><td>#'+x.recordId+'</td></tr>').join('')+'</tbody></table>'+(S.audit.length?'':'<div class="empty">Sin actividad visible para este perfil.</div>')+'</div>'}
function auditDetail(i){const x=S.audit[i];modal('Cambio #'+x.recordId,'BITÁCORA','<p>'+esc(x.user)+' · '+esc(x.action)+'</p><p>'+esc(x.reason||'Sin motivo adicional')+'</p><h3>Antes</h3><pre class="auditjson">'+esc(JSON.stringify(x.before,null,2))+'</pre><h3>Después</h3><pre class="auditjson">'+esc(JSON.stringify(x.after,null,2))+'</pre>')}
function oldHelpPage(){$('#content').innerHTML=head('Prueba un flujo completo','Una ruta corta para conocer la versión funcional.')+'<div class="grid2"><section class="card"><h2>De la cotización al informe</h2><ol style="line-height:2.1;padding-left:20px"><li>Entra como <b>Administrador Demo</b>.</li><li>Crea un cliente o utiliza uno existente.</li><li>Crea una cotización con método 1, vigencia futura y revisión técnica.</li><li>Avanza a Revisión, Enviada y Seguimiento.</li><li>Edita la propuesta y registra la aceptación del cliente.</li><li>Acepta: el sistema crea una orden Por programar. Define recursos y avanza a Programado.</li><li>Edita la orden: técnico Ana (usuario 6), equipo 4, fecha e ítem recibido.</li><li>Avanza a Ejecución y captura el registro técnico.</li><li>Registra incertidumbre y k para una calibración.</li><li>Avanza a Revisión técnica y Autorizado.</li><li>Crea el informe: selecciona plantilla y completa fechas, ítem y trazabilidad; revísalo y emítelo.</li><li>Abre su vista imprimible y guarda como PDF.</li></ol></section><section class="card"><h2>Comprueba los permisos</h2><p style="margin:18px 0">Cambia a <b>Técnico Ana Demo</b>: puede trabajar con sus servicios y resultados, pero no administrar usuarios ni emitir informes.</p><p style="margin:18px 0">Cambia a <b>Auditor Demo</b>: puede consultar, pero el servidor rechaza modificaciones.</p><h2 style="margin-top:28px">Comprueba los bloqueos</h2><p style="margin:16px 0">Intenta iniciar OS-2026-0001: su equipo tiene la calibración vencida. OS-2026-0002 tiene equipo fuera de servicio y recepción no conforme.</p><p style="margin:16px 0">El método 3 tiene un control fuera de criterio: debe investigarse antes de autorizar resultados.</p><div class="hint">Los perfiles son simulaciones dentro de tu cuenta privada. Para acceso de empleados reales habrá que vincular cada identidad a su rol y habilitar el acceso del sitio.</div></section><section class="card wide"><h2>Compras, calibraciones y nuevos módulos</h2><p style="margin:15px 0">Como Técnico Ana, crea una solicitud de compra, guarda, adjunta cotización y envíala. Cambia a Administrador para verla en Notificaciones y aprobarla. En Programa de calibración, captura certificado y evaluación antes de cerrar. Usa Recursos Humanos Demo para prenómina y Contabilidad Demo para preparar pólizas; el administrador las autoriza.</p><p style="margin:15px 0">En Políticas y procedimientos, redacta las seis secciones y envía a revisión. En Diseñador de informes, crea o versiona una plantilla, personalízala y apruébala antes de utilizarla en un informe.</p><p style="margin:15px 0">Referencia para los campos de informes: <a href="https://www.nist.gov/system/files/documents/2019/05/14/sop-1-calibration-certificate-eval-app-b-c-20190506.pdf" target="_blank" rel="noopener">lista de revisión de certificados de NIST (sección 7.8)</a>. Se requiere validación técnica contra la norma y el alcance real antes de operar.</p><h2>Respaldo y alcance</h2><p style="margin:15px 0">Los cambios se conservan en el servidor. El respaldo contiene los registros y el índice de evidencias; los archivos adjuntos se descargan desde cada expediente.</p>'+(['Administrador','Calidad','Auditor'].includes(S.me.role)?'<a href="/api/export"><button>↓ Descargar respaldo JSON</button></a>':'')+'<p class="notes">Incluye cotizaciones, programación, calibración, registros técnicos, informes, documentos, competencia, gestión, proveedores, compras, notificaciones y bitácora. Los cálculos técnicos se capturan manualmente; no hay motor de incertidumbre validado, cálculo fiscal de nómina, timbrado fiscal ni envío de correos. Esta versión no acredita cumplimiento de la norma.</p></section></div>'}
function printWindow(title,body){const w=window.open('','_blank');if(!w){toast('Permite ventanas emergentes para imprimir');return}w.document.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{font:14px/1.6 system-ui;padding:40px;max-width:850px;margin:auto;color:#183a3b}h1{font-size:25px}table{border-collapse:collapse;width:100%;margin:25px 0}td,th{border:1px solid #ddd;padding:10px;text-align:left}.warning{background:#fff3df;padding:12px;font-weight:bold}button{padding:10px 18px;margin:20px 0}@media print{button{display:none}}.loginhero{background:linear-gradient(145deg,#102d59,#1f59a2)}.loginhero p{color:#bcd1ec}.orbit{border-color:#608bca}.orbit span{color:#d6e8ff}.progress span.done{background:#4e81c9}.permissions span{background:#eaf1ff}.auditjson{background:#f4f7fd}button:hover{background:#edf3ff}</style></head><body><div class="warning">DEMOSTRACIÓN · Datos ficticios · Sin validez técnica ni acreditación</div>'+body+'<button onclick="window.print()">Imprimir / Guardar como PDF</button></body></html>');w.document.close()}
function oldPrintReport(id){const r=ref('reports',id),sv=r.snapshot?.service||ref('services',r.serviceId),rt=r.snapshot?.record||S.records.find(x=>x.serviceId===sv.id),mt=r.snapshot?.method||ref('methods',sv.methodId),q=ref('quotes',sv.quoteId),client=r.snapshot?.client||ref('clients',q.clientId),t=r.templateSnapshot||ref('templates',r.templateId);if(!t){toast('Selecciona una plantilla del informe');return}reportPrint(t,r,sv,rt,mt,client)}
function oldPrintQuote(id){const q=ref('quotes',id),cl=ref('clients',q.clientId);printWindow(q.folio,'<h1>LabFlow · Laboratorio Demo Delta</h1><h2>Cotización '+esc(q.folio)+'</h2><p>Cliente: '+esc(cl.name)+'</p><p>Vigencia: '+date(q.due)+'</p><table><tr><th>Servicio</th><th>Importe</th></tr><tr><td>'+esc(q.description)+'</td><td>'+money(q.amount)+'</td></tr></table><p>Importe registrado sin desglose fiscal. Estado: '+esc(q.status)+'</p><p>Aceptación: '+esc(q.acceptance||'Pendiente')+'</p>')}
