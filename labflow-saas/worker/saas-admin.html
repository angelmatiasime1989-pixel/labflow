<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LabFlow · Administración SaaS</title><style>
:root{--ink:#17314e;--muted:#72849a;--blue:#2569aa;--line:#e1e9f3;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;font:14px/1.6 Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--ink);font-weight:600}button:hover{border-color:#a7c4e2;background:#f4f8fd}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:#1c578f;color:white}a{color:var(--blue);text-decoration:none}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #dce5f0;border-radius:9px;color:var(--ink);background:#fff}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{outline:3px solid #2569aa16;border-color:#78a6d2}button:focus-visible,a:focus-visible{outline:3px solid #95bde6;outline-offset:3px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.side{background:linear-gradient(160deg,#193451,#102238);padding:28px 18px;color:#d4e4f6;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:7px}.brand{font-size:25px;font-weight:750;letter-spacing:-.8px;color:#fff;display:flex;align-items:center;gap:10px;margin-bottom:4px}.brandmark{display:grid;place-items:center;width:39px;height:39px;background:#397fb6;border-radius:12px;font-size:29px}.sidetitle{font-size:10px;text-transform:uppercase;letter-spacing:1.8px;color:#90accb;margin:0 0 28px 49px}.nav{background:transparent;border:0;color:#bdd1e8;display:flex;align-items:center;gap:12px;text-align:left;padding:13px 15px}.nav svg{width:20px;height:20px}.nav.active{background:#294e76;color:#fff}.nav:hover{background:#ffffff0c;color:white}.sidefoot{margin-top:auto;padding:20px 10px 0;border-top:1px solid #ffffff14;font-size:12px;color:#8ea9c8}.top{background:#fff;border-bottom:1px solid var(--line);padding:22px 34px;display:flex;align-items:center;justify-content:space-between;gap:16px}.top small{color:var(--muted)}.identity{display:flex;align-items:center;gap:10px}.avatar{width:35px;height:35px;display:grid;place-items:center;border-radius:50%;background:#eaf2fc;color:#3374ac;font-weight:750}.work{padding:30px 34px 50px;max-width:1650px;margin:auto}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:1.8px;font-weight:700;color:#6f94b7;text-transform:uppercase}h1{font-size:31px;letter-spacing:-.9px;line-height:1.25;margin:7px 0 8px}h2{font-size:18px;margin:0 0 8px}h3{font-size:14px;margin:0 0 6px}p{color:var(--muted);margin:5px 0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;margin:0 0 26px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:23px;box-shadow:0 3px 15px #1c385804;min-width:0}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:34px;line-height:1.1;margin:14px 0;font-weight:650}.stat small{font-size:11px;color:#8b9bb0}.stat-icon{float:right;width:35px;height:35px;padding:8px;border-radius:11px;background:#edf4fc;color:#3a77af}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}.empty{padding:50px 20px;text-align:center}.empty svg{width:40px;height:40px;color:#7da8ce;margin-bottom:12px}.empty h2{font-size:20px}.empty p{margin-bottom:20px}.tablewrap{max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:12px;background:white}table{border-collapse:collapse;width:100%;font-size:12px;text-align:left}th{font-size:10px;text-transform:uppercase;color:#8193a9;letter-spacing:.8px;background:#f7f9fc;padding:14px 16px;font-weight:650}td{padding:16px;border-top:1px solid #edf1f7;vertical-align:middle}td small{display:block;color:var(--muted);margin-top:3px}.pill{display:inline-flex;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:650;background:#eaf2fc;color:#3a6b98;white-space:nowrap}.pill.green{background:#e9f5ef;color:#307a58}.pill.amber{background:#fff5e6;color:#997228}.pill.red{background:#fff0f0;color:#a54949}.modulechips{display:flex;flex-wrap:wrap;gap:4px;max-width:300px}.modulechips span{font-size:10px;background:#f1f5fa;color:#6884a2;padding:3px 6px;border-radius:5px}.toolbar{display:flex;gap:12px;margin-bottom:18px;align-items:center;flex-wrap:wrap}.toolbar input{max-width:440px}.toolbar select{max-width:200px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.field{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:600}.field small{font-size:11px;color:var(--muted);font-weight:400}.full{grid-column:1/-1}.modulegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.module-option{position:relative;background:#fff;border:1px solid #e0e8f2;border-radius:13px;padding:18px;cursor:pointer;display:flex;flex-direction:column;min-height:160px;transition:border-color .15s,background .15s}.module-option.selected{background:#f3f8ff;border-color:#8bb2db}.module-option.locked{opacity:.55;cursor:default}.module-option input{position:absolute;top:17px;right:16px;accent-color:#2c73b5;width:19px;height:19px;cursor:inherit}.module-option .icon{background:#eaf2fc;color:#377ab3;width:38px;height:38px;border-radius:10px;padding:9px;display:flex;margin-bottom:13px}.module-option strong{font-size:13px;display:block;padding-right:24px}.module-option p{font-size:11px;line-height:1.5}.module-option small{font-size:10px;color:#5d86b1;margin-top:8px}.hint{background:#edf4fb;border:1px solid #dbe8f5;border-radius:10px;padding:13px 16px;font-size:12px;color:#5d7c9b;margin:14px 0}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}.error{background:#fff0f0;border:1px solid #efd0d0;color:#a03d3d;padding:12px;border-radius:10px;margin:15px 0}.success{background:#edf7f1;color:#377a56;padding:12px;border-radius:10px}.back{margin-bottom:18px}.modalback{position:fixed;inset:0;background:#172c4760;z-index:100;display:grid;place-items:center;padding:18px;backdrop-filter:blur(3px)}.modal{background:#fff;max-width:540px;width:100%;border-radius:16px;padding:26px;max-height:90vh;overflow:auto}.loading{padding:80px 20px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:24px;right:24px;background:#17314e;color:#fff;padding:13px 20px;border-radius:11px;z-index:120;max-width:90vw}.guide-item{display:flex;gap:13px;margin:20px 0}.guide-item b{display:grid;place-items:center;width:28px;height:28px;flex:0 0 28px;border-radius:9px;background:#eef4fc;color:#467aad}.guide-item p{font-size:12px}.mobile{display:none}.top-actions{display:flex;align-items:center;gap:12px}.linkbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:15px;background:#f5f8fc;border-radius:10px;margin:12px 0}.linkbox code{font-size:12px;overflow-wrap:anywhere}.cataloggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.catalogcard .icon{width:42px;height:42px;padding:10px;border-radius:11px;background:#edf4fb;color:#3a78ad;margin-bottom:14px}.catalogcard p{font-size:12px;min-height:40px}.catalogcard small{font-size:11px;color:#8496ab}.divider{height:1px;background:var(--line);margin:24px 0}svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}html,body{max-width:100%;overflow-x:clip}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.modulegrid,.cataloggrid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.work{padding:25px}.top{padding:20px 25px}}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{position:fixed;left:0;z-index:80;width:250px;transform:translateX(-100%);transition:transform .2s}.side.open{transform:translateX(0);box-shadow:12px 0 40px #17314e25}.mobile{display:block}.top{padding:15px}.identity .name{display:none}.work{padding:22px 16px}.head{flex-direction:column}.head h1{font-size:27px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.modulegrid,.cataloggrid{grid-template-columns:repeat(2,minmax(0,1fr))}.module-option{padding:15px;min-height:170px}.stats{gap:12px}.card{padding:18px}.stat strong{font-size:30px}.actions{justify-content:flex-start}td,th{padding:12px}.tablewrap table{min-width:620px}.toolbar input,.toolbar select{max-width:100%}.top small{font-size:10px}}
@media(max-width:390px){.modulegrid,.cataloggrid{grid-template-columns:1fr}}
.modulegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.module-option{min-width:0}.module-option strong{font-size:22px}.module-option input[type=radio]{accent-color:#2563a6}@media(max-width:900px){.modulegrid{grid-template-columns:1fr}}
</style></head><body><div id="root"><div class="loading">Abriendo la administración del servicio…</div></div><div id="overlay"></div><div id="toast" hidden></div><script>
let P=null,page='dashboard',filter='',statusFilter='',draftMembership='basic',editing=null;
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shapes={dashboard:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M13 3a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-3.87 M5 7a4 4 0 1 0 8 0a4 4 0 1 0-8 0',layers:'m12 3 9 5-9 5-9-5 9-5 m-9 10 9 5 9-5 m-18 5 9 5 9-5',history:'M3 11a9 9 0 1 1 3 7 M3 4v7h7 M12 7v5l3 2',briefcase:'M3 7h18v14H3z M8 7V3h8v4 M3 12l9 3 9-3',workflow:'M3 3h6v6H3z M15 15h6v6h-6z M9 6h9v9 M6 9v9h9',gauge:'M3 18a10 10 0 1 1 18 0 M12 13l5-5 M10 15a2 2 0 1 0 4 0a2 2 0 1 0-4 0',flask:'M9 3h6 M10 3v7l-6 9q-1 2 2 2h12q3 0 2-2l-6-9V3 M7 15h10',shield:'M12 3 3 7v6q0 5 9 9 9-4 9-9V7l-9-4 M8 12l3 3 5-6',cart:'M2 3h3l3 12h11l3-8H6 M8 20h1 M18 20h1',box:'m12 3 9 5v9l-9 5-9-5V8l9-5 M3 8l9 5 9-5 M12 13v9',chart:'M3 3v18h18 M7 16v-5 M12 16V7 M17 16v-8',settings:'M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1 1-3 M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0',arrow:'M5 12h14 M14 7l5 5-5 5',lock:'M6 10h12v11H6z M8 10V6a4 4 0 0 1 8 0v4'};
const icon=name=>'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+(shapes[name]||shapes.layers)+'"/></svg>';
function toast(text){const box=$('#toast');box.className='toast';box.hidden=false;box.textContent=text;setTimeout(()=>box.hidden=true,4500);}
async function api(path,body){const response=await fetch('/api/saas/'+path,{method:body?'POST':'GET',cache:'no-store',headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify({revision:P?.revision,...body})}:{})});let data;try{data=await response.json()}catch{throw Error('No se pudo recibir la respuesta. Reintenta.')}if(!response.ok)throw Object.assign(Error(data.error||'No se pudo completar'),{status:response.status});return data;}
async function refresh(){P=await api('state');render();}async function start(){try{await refresh()}catch(e){$('#root').innerHTML='<main class="loading"><h1>Administración de LabFlow</h1><p>'+esc(e.message)+'</p>'+(e.status===401?'<p>Abre este sitio con tu cuenta autorizada de ChatGPT.</p>':'')+'<button onclick="start()">Reintentar</button></main>';}}
function nav(next){page=next;filter='';statusFilter='';render();}
function render(){$('#root').innerHTML='<div class="layout"><aside class="side" id="side"><div class="brand"><span class="brandmark">∿</span>LabFlow</div><div class="sidetitle">Administración SaaS</div>'+[['dashboard','dashboard','Resumen'],['customers','users','Clientes'],['catalog','layers','Módulos'],['audit','history','Bitácora']].map(([k,i,t])=>'<button class="nav '+(page===k?'active':'')+'" onclick="nav(\''+k+'\')">'+icon(i)+t+'</button>').join('')+'<div class="sidefoot">Panel del proveedor<br>Los clientes trabajan en espacios independientes.</div></aside><main><header class="top"><div><button class="mobile" onclick="$(\'#side\').classList.toggle(\'open\')">☰ Menú</button><small>LABFLOW / ADMINISTRACIÓN DEL SERVICIO</small></div><div class="top-actions"><span class="pill">Acceso privado</span><div class="identity"><span class="avatar">A</span><span class="name">'+esc(P.operator.name)+'</span></div><button onclick="refresh().catch(e=>toast(e.message))" title="Actualizar">↻</button></div></header><div class="work" id="content"></div></main></div>';if(page==='dashboard')dashboard();else if(page==='customers')customers();else if(page==='catalog')catalog();else if(page==='audit')audit();else if(page==='editor')editor(editing);else if(page==='customer')customerDetail(editing);}
function head(title,text,button=''){return '<div class="head"><div><div class="eyebrow">Administración del servicio</div><h1>'+esc(title)+'</h1><p>'+esc(text)+'</p></div>'+button+'</div>';}
function statusPill(status){return '<span class="pill '+(status==='Activo'?'green':status==='Suspendido'?'red':'amber')+'">'+esc(status)+'</span>';}
function table(rows){return '<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Estado</th><th>Membresía</th><th>Actualizado</th><th></th></tr></thead><tbody>'+rows.map(c=>'<tr><td><b>'+esc(c.name)+'</b><small>'+esc(c.contact||c.email||c.slug)+'</small></td><td>'+statusPill(c.status)+'</td><td><div class="modulechips">'+'<span>'+esc(P.packages.find(p=>p.id===c.membership)?.name||c.membership)+'</span>'+'</div></td><td>'+new Date(c.updatedAt).toLocaleDateString('es-MX')+'</td><td><button onclick="openCustomer(\''+c.id+'\')">Administrar</button></td></tr>').join('')+'</tbody></table></div>';}
function empty(){return '<div class="empty">'+icon('users')+'<h2>El primer cliente empieza aquí</h2><p>Registra su laboratorio y elige su membresía.</p><button class="primary" onclick="newCustomer()">＋ Dar de alta cliente</button></div>';}
function dashboard(){const all=P.customers,active=all.filter(c=>c.status==='Activo').length,prepared=all.filter(c=>c.status==='En preparación').length,ready=P.catalog.filter(m=>m.status==='ready').length;$('#content').innerHTML=head('Tu servicio, bajo control','Administra clientes, accesos y membresías desde un solo panel.','<button class="primary" onclick="newCustomer()">＋ Nuevo cliente</button>')+'<div class="stats">'+[['Clientes registrados',all.length,'Todos los espacios del servicio','users'],['Clientes activos',active,'Acceso al laboratorio habilitado','shield'],['En preparación',prepared,'Pendientes de activar','workflow'],['Módulos disponibles',ready,'Incluidos según membresía','layers']].map(([t,n,d,i])=>'<section class="card stat"><span class="stat-icon">'+icon(i)+'</span><label>'+t+'</label><strong>'+n+'</strong><small>'+d+'</small></section>').join('')+'</div><div class="grid"><section class="card"><div class="sectionhead"><h2>Clientes recientes</h2><button onclick="nav(\'customers\')">Ver todos →</button></div>'+(all.length?table(all.slice().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).slice(0,5)):empty())+'</section><section class="card"><h2>Una configuración sencilla</h2>'+[['Registra el cliente','Nombre, contacto y acceso al laboratorio.'],['Elige la membresía','Básico, Medio o Avanzado: accesos completos aplicados automáticamente.'],['Activa el servicio','Entrega el enlace y las credenciales de su administrador.']].map(([t,d],i)=>'<div class="guide-item"><b>'+(i+1)+'</b><div><h3>'+t+'</h3><p>'+d+'</p></div></div>').join('')+'<div class="hint">El panel del proveedor y los espacios de los clientes están separados.</div></section></div>';}
function customers(){$('#content').innerHTML=head('Clientes','Altas, membresías, estado del servicio y acceso a cada laboratorio.','<button class="primary" onclick="newCustomer()">＋ Nuevo cliente</button>')+'<div class="toolbar"><input type="search" placeholder="Buscar cliente, contacto o identificador…" value="'+esc(filter)+'" oninput="filter=this.value;paintCustomers()"><select onchange="statusFilter=this.value;paintCustomers()"><option value="">Todos los estados</option>'+['Activo','En preparación','Suspendido'].map(s=>'<option '+(statusFilter===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div id="customers-table"></div>';paintCustomers();}
function paintCustomers(){const rows=P.customers.filter(c=>(!filter||(c.name+' '+c.contact+' '+c.email+' '+c.slug).toLowerCase().includes(filter.toLowerCase()))&&(!statusFilter||c.status===statusFilter));$('#customers-table').innerHTML=P.customers.length?(rows.length?table(rows):'<section class="card"><p>No hay clientes que coincidan.</p></section>'):empty();}
function newCustomer(){editing=null;draftMembership='basic';page='editor';render();}function editCustomer(id){editing=id;draftMembership=P.customers.find(c=>c.id===id).membership;page='editor';render();}function openCustomer(id){editing=id;page='customer';render();}
function editor(id){const c=P.customers.find(c=>c.id===id)||{};$('#content').innerHTML='<button class="back" onclick="nav(\'customers\')">← Volver a clientes</button>'+head(id?'Configurar '+c.name:'Dar de alta cliente','Cada laboratorio conserva sus propios usuarios, registros y archivos.')+'<form id="customer-form" onsubmit="saveCustomer(event)"><section class="card"><h2>Datos del cliente</h2><div class="formgrid"><label class="field">Nombre del laboratorio *<input name="name" value="'+esc(c.name||'')+'" maxlength="160" required oninput="suggestSlug(this)"></label><label class="field">Identificador del acceso *<input name="slug" value="'+esc(c.slug||'')+'" pattern="[a-z0-9][a-z0-9-]{1,48}[a-z0-9]" required '+(id?'readonly':'')+' oninput="this.dataset.manual=\'true\'"><small>Forma el enlace del cliente. Ejemplo: laboratorio-norte.</small></label><label class="field">Razón social<input name="legalName" value="'+esc(c.legalName||'')+'"></label><label class="field">RFC<input name="rfc" value="'+esc(c.rfc||'')+'" maxlength="20"></label><label class="field">Contacto<input name="contact" value="'+esc(c.contact||'')+'"></label><label class="field">Correo<input name="email" type="email" value="'+esc(c.email||'')+'"></label><label class="field">Teléfono<input name="phone" value="'+esc(c.phone||'')+'" maxlength="60"></label><label class="field">Estado del servicio<select name="status">'+['En preparación','Activo','Suspendido'].map(s=>'<option '+((c.status||'En preparación')===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label></div></section><div class="divider"></div><section class="card"><h2>Membresía del cliente</h2><p>Elige un paquete. Sus accesos se aplican juntos para mantener completos los flujos.</p><div id="package-grid" class="modulegrid"></div><div id="package-summary" class="hint"></div></section><div class="divider"></div><section class="card"><h2>Administrador del laboratorio</h2><div class="formgrid"><label class="field">Usuario *<input name="adminUsername" value="'+esc(c.adminUsername||'admin')+'" pattern="[a-z0-9_.-]{3,40}" required></label><label class="field">'+(id?'Contraseña nueva (opcional)':'Contraseña inicial *')+'<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" '+(id?'':'required')+'><small>'+(id?'Déjala vacía para conservar la actual. Cambiarla cerrará las sesiones anteriores.':'Mínimo 12 caracteres. No se guardará en texto visible.')+'</small></label><label class="field full">Notas del servicio<textarea name="notes" maxlength="4000">'+esc(c.notes||'')+'</textarea></label></div></section><div id="form-error" role="alert"></div><div class="actions"><button type="button" onclick="nav(\'customers\')">Cancelar</button><button class="primary" type="submit">'+(id?'Guardar configuración':'Crear cliente y su laboratorio')+'</button></div></form>';paintPackages();}
function suggestSlug(input){const field=$('#customer-form').elements.slug;if(!field.readOnly&&!field.dataset.manual)field.value=input.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50);}
function paintPackages(){$('#package-grid').innerHTML=P.packages.map(p=>'<label class="module-option '+(draftMembership===p.id?'selected':'')+'"><input type="radio" name="membership-choice" value="'+p.id+'" '+(draftMembership===p.id?'checked':'')+' onchange="selectMembership(\''+p.id+'\')"><strong>'+esc(p.name)+'</strong><p>'+esc(p.description)+'</p><small>'+p.modules.length+' módulos · '+(p.id==='advanced'?'Acceso completo':p.id==='medium'?'Operación y abastecimiento':'Operación esencial completa')+'</small></label>').join('');const p=P.packages.find(p=>p.id===draftMembership);$('#package-summary').innerHTML='<b>Incluye:</b> '+p.modules.map(id=>esc(P.catalog.find(m=>m.id===id)?.name||id)).join(', ')+'.<br>Al cambiar de membresía se conservan los registros. Los accesos se actualizan al guardar.';}
function selectMembership(id){if(!P.packages.some(p=>p.id===id))return;draftMembership=id;paintPackages();}
async function saveCustomer(event){event.preventDefault();const form=event.target,button=form.querySelector('[type=submit]');if(button.disabled)return;button.disabled=true;$('#form-error').innerHTML='';try{const data=Object.fromEntries(new FormData(form));const r=await api('customer',{...data,id:editing,membership:draftMembership});editing=r.id;page='customer';await refresh();toast('Cliente y configuración guardados');}catch(e){$('#form-error').innerHTML='<div class="error">'+esc(e.message)+'</div>';if(e.status===409){const latest=await api('state');P=latest;}}finally{button.disabled=false;}}
function customerDetail(id){const c=P.customers.find(c=>c.id===id);if(!c)return nav('customers');const link=location.origin+'/laboratorio/'+c.slug+'/';$('#content').innerHTML='<button class="back" onclick="nav(\'customers\')">← Volver a clientes</button>'+head(c.name,'Configuración y acceso independiente al laboratorio.','<button class="primary" onclick="editCustomer(\''+c.id+'\')">Configurar cliente</button>')+'<div class="grid"><section class="card"><div class="sectionhead"><h2>Acceso al laboratorio</h2>'+statusPill(c.status)+'</div><p>Usuario administrador: <b>'+esc(c.adminUsername)+'</b></p><div class="linkbox"><code>'+esc(link)+'</code><button onclick="copyLink(\''+c.slug+'\')">Copiar enlace</button></div><a href="'+esc(link)+'" target="_blank" rel="noopener"><button '+(c.status!=='Activo'?'disabled':'')+'>Abrir LabFlow del cliente ↗</button></a><div class="hint">'+(c.status==='Activo'?'El laboratorio está activo. Ingresa con sus credenciales.':'Activa el cliente desde su configuración para permitir el acceso.')+'</div><p>'+esc(c.contact||'Sin contacto registrado')+'<br>'+esc(c.email||'')+'<br>'+esc(c.phone||'')+'</p></section><section class="card"><h2>Membresía '+esc(P.packages.find(p=>p.id===c.membership)?.name||c.membership)+'</h2><p>Herramientas incluidas en el paquete:</p>'+c.modules.map(id=>{const m=P.catalog.find(x=>x.id===id);return '<div class="guide-item"><b>✓</b><div><h3>'+esc(m?.name||id)+'</h3><p>'+esc(m?.description||'')+'</p></div></div>';}).join('')+'</section></div>'+(c.notes?'<section class="card" style="margin-top:20px"><h2>Notas del servicio</h2><p>'+esc(c.notes)+'</p></section>':'');}
async function copyLink(slug){try{await navigator.clipboard.writeText(location.origin+'/laboratorio/'+slug+'/');toast('Enlace copiado');}catch{toast('Selecciona el enlace y cópialo.');}}
function catalog(){$('#content').innerHTML=head('Catálogo de módulos','Los módulos del servicio y la preparación de futuras herramientas.','<button class="primary" onclick="newModule()">＋ Registrar módulo futuro</button>')+'<div class="cataloggrid">'+P.catalog.map(m=>'<section class="card catalogcard"><div class="icon">'+icon(m.icon)+'</div><h2>'+esc(m.name)+'</h2><p>'+esc(m.description)+'</p><div class="sectionhead">'+(m.status==='ready'?'<span class="pill green">Disponible</span>':'<span class="pill amber">Pendiente de integrar</span>')+'<small>'+m.toolCount+' herramientas</small></div>'+(m.requires?.length?'<small>Necesita: '+m.requires.map(id=>esc(P.catalog.find(x=>x.id===id)?.name||id)).join(', ')+'</small>':'<small>Base del servicio</small>')+'</section>').join('')+'</div>';}
function newModule(){$('#overlay').innerHTML='<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="Registrar módulo futuro"><h2>Registrar módulo futuro</h2><p>Reserva su lugar en el catálogo. Se podrá asignar cuando sus herramientas estén integradas.</p><form onsubmit="saveModule(event)"><label class="field">Nombre<input name="name" required maxlength="120"></label><label class="field">Identificador<input name="moduleId" required pattern="[a-z][a-z0-9-]{2,40}" placeholder="nuevo-modulo"></label><label class="field">Descripción<textarea name="description" maxlength="500"></textarea></label><div id="module-error"></div><div class="actions"><button type="button" onclick="$(\'#overlay\').innerHTML=\'\'">Cancelar</button><button class="primary">Registrar</button></div></form></section></div>';}
async function saveModule(event){event.preventDefault();const form=event.target,button=form.querySelector('.primary');button.disabled=true;try{await api('catalog',Object.fromEntries(new FormData(form)));$('#overlay').innerHTML='';await refresh();toast('Módulo futuro registrado');}catch(e){$('#module-error').innerHTML='<div class="error">'+esc(e.message)+'</div>';button.disabled=false;}}
function audit(){$('#content').innerHTML=head('Bitácora del servicio','Historial de altas, cambios de membresías, estados y contraseñas administrativas.')+(P.audit.length?'<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Acción</th><th>Cliente / módulo</th><th>Detalle</th></tr></thead><tbody>'+P.audit.map(a=>'<tr><td>'+new Date(a.at).toLocaleString('es-MX')+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.customerName||a.details?.name||'')+'</td><td>'+esc(P.packages.find(p=>p.id===a.details?.membership)?.name||'')+' · '+esc(a.details?.status||'')+'<small>'+esc((a.details?.modules||[]).map(id=>P.catalog.find(m=>m.id===id)?.name||id).join(', '))+(a.details?.passwordReset?' · Contraseña actualizada':'')+'</small></td></tr>').join('')+'</tbody></table></div>':'<section class="card empty"><p>Las operaciones del servicio aparecerán aquí.</p></section>');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#overlay').innerHTML='';});start();
</script></body></html>
