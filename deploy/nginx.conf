# Ejemplo: instalar certificado y sustituir dominio/rutas antes de habilitar.
server {
    listen 443 ssl;
    server_name cubolabs.tudominio.com;
    ssl_certificate /ruta/certificado/fullchain.pem;
    ssl_certificate_key /ruta/certificado/privkey.pem;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
server {
    listen 80;
    server_name cubolabs.tudominio.com;
    return 301 https://$host$request_uri;
}
