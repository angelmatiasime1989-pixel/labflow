<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#071b38"><title>Administración · cubolabs</title><style>body{margin:0;background:#eef3f9;color:#112b49;font:16px/1.5 system-ui;min-height:100dvh;display:grid;place-items:center}main{box-sizing:border-box;width:min(440px,calc(100% - 32px));background:white;padding:36px;border:1px solid #dce6f0;border-radius:24px;box-shadow:0 24px 80px #071b3814}img{width:190px;max-width:100%}h1{font-size:26px;margin-bottom:8px}p{color:#657990}label{display:grid;gap:6px;margin:18px 0}input,button{box-sizing:border-box;font:inherit;border-radius:10px;padding:12px 14px}input{width:100%;border:1px solid #c8d6e5}button{width:100%;border:0;background:#163c68;color:white;cursor:pointer}button:disabled{opacity:.6}a{color:#245c94}#error{color:#a52c3e}</style></head><body><main><a href="/"><img src="/assets/cubolabs-color.png" alt="cubolabs"></a><h1>Administra tu servicio.</h1><p>Acceso exclusivo al panel SaaS.</p><form id="login"><label>Usuario<input name="username" autocomplete="username" required autofocus maxlength="80"></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><p id="error" role="alert"></p><button>Entrar al panel</button></form><p><a href="/entrar">Entrar a mi laboratorio →</a></p></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button'),error=document.getElementById('error');b.disabled=true;error.textContent='';try{const r=await fetch('/api/provider/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:f.elements.username.value,password:f.elements.password.value})}),d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo iniciar sesión');location.replace(d.mustChangePassword?'/administrador/cambiar-contrasena':'/admin/');}catch(err){error.textContent=err.message;b.disabled=false;}};</script></body></html>
