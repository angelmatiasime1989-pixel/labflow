<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#071b38"><title>Administración · cubolabs</title><style>body{margin:0;background:#eef3f9;color:#112b49;font:16px/1.5 system-ui;min-height:100dvh;display:grid;place-items:center}main{box-sizing:border-box;width:min(440px,calc(100% - 32px));background:white;padding:36px;border:1px solid #dce6f0;border-radius:24px;box-shadow:0 24px 80px #071b3814}img{width:190px;max-width:100%}h1{font-size:26px;margin-bottom:8px}p{color:#657990}label{display:grid;gap:6px;margin:18px 0}input,button{box-sizing:border-box;font:inherit;border-radius:10px;padding:12px 14px}input{width:100%;border:1px solid #c8d6e5}button{width:100%;border:0;background:#163c68;color:white;cursor:pointer}button:disabled{opacity:.6}a{color:#245c94}#error{color:#a52c3e}.password-wrap{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:stretch}.password-wrap input{min-width:0;height:48px}.password-wrap .password-eye{position:static;width:44px;min-width:44px;height:48px;margin:0;padding:0;display:grid;place-items:center;background:#edf2f8;color:#112b49;border:1px solid #8295ad;border-radius:10px}.password-eye svg{pointer-events:none}</style><link rel="icon" href="/pwa/icon.svg" type="image/svg+xml"></head><body><main><a href="/"><img src="/assets/cubolabs-color.png" alt="cubolabs"></a><h1>Administra tu servicio.</h1><p>Acceso exclusivo al panel SaaS.</p><form id="login"><label>Usuario<input name="username" autocomplete="username" required autofocus maxlength="80"></label><label>Contraseña<div class="password-wrap"><input name="password" type="password" autocomplete="current-password" required maxlength="128"><button class="password-eye" type="button" aria-label="Mostrar contraseña" aria-pressed="false" onclick="const i=this.previousElementSibling;const show=i.type==='password';i.type=show?'text':'password';this.setAttribute('aria-pressed',String(show));this.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña')"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></label><p id="error" role="alert"></p><button type="submit">Entrar al panel</button></form><p><a href="/entrar">Entrar a mi laboratorio →</a></p></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('[type=submit]'),error=document.getElementById('error');b.disabled=true;error.textContent='';try{const r=await fetch('/api/provider/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:f.elements.username.value,password:f.elements.password.value})}),d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo iniciar sesión');location.replace(d.mustChangePassword?'/administrador/cambiar-contrasena':'/admin/');}catch(err){error.textContent=err.message;b.disabled=false;}};</script></body></html>
