<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar acceso · Qubo Labs</title><style>body{margin:24px auto;padding:20px;max-width:540px;background:#f4f7fb;color:#071b38;font:16px/1.6 system-ui}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px}button{background:#155cce;color:white;border:0;border-radius:10px}a{color:#155cce}[hidden]{display:none!important}</style></head><body><h1>Recuperar acceso</h1><p>Para usuarios de laboratorio. No solicita datos de pago.</p><form id="request"><label>Identificador del laboratorio<input name="slug" required maxlength="50" autocomplete="organization"></label><label>Usuario<input name="username" required maxlength="40" autocomplete="username"></label><button>Solicitar instrucciones</button></form><form id="reset" hidden><label>Nueva contraseña (12 a 128 caracteres)<input type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>Confirmar contraseña<input type="password" name="confirm" minlength="12" maxlength="128" autocomplete="new-password" required></label><button>Guardar contraseña</button></form><p id="status" role="status" aria-live="polite"></p><a href="/entrar">Volver al acceso</a><script>let token=new URLSearchParams(location.hash.slice(1)).get('token');history.replaceState(null,'',location.pathname);const reset=document.querySelector('#reset'),request=document.querySelector('#request'),status=document.querySelector('#status');reset.hidden=!token;request.hidden=!!token;for(const form of [request,reset])form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');if(form===reset&&form.password.value!==form.confirm.value){status.textContent='Las contraseñas no coinciden.';return;}button.disabled=true;try{const body=form===reset?{token,password:form.password.value}:{slug:form.slug.value,username:form.username.value};const r=await fetch('/api/account/recovery/'+(form===reset?'reset':'request'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const result=await r.json();status.textContent=result.message||result.error;if(form===reset&&r.ok){token=null;form.reset();form.hidden=true;}}catch{status.textContent='No se pudo completar la solicitud. Reintenta.';}finally{button.disabled=false;}};</script></body></html>
